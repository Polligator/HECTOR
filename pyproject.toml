[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hector-sc"
version = "1.0"
description = "HECTOR single-cell inference and trajectory visualization package."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["single-cell", "cell type annotation", "trajectory analysis", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Everything a user needs for the full documented feature set. HECTOR is a
# scientific end-user tool, not a library to build on: splitting features
# across optional extras only makes people debug ImportErrors. The one thing
# that genuinely cannot be auto-detected at install time is the presence of an
# NVIDIA GPU, so that stays the single opt-in extra below.
dependencies = [
  "anndata>=0.10",
  "gprofiler-official>=1.0",
  "h5py>=3.10",
  "huggingface-hub>=0.30",
  "leidenalg>=0.10",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.25",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyarrow>=14.0",
  "plotly>=5.20",
  "pynndescent>=0.5",
  "python-igraph>=0.10",
  "scanpy>=1.10",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "tqdm>=4.66",

  # Default inference backend: TensorFlow on CPU outside native Apple Silicon.
  "tensorflow>=2.16; sys_platform != 'darwin'",
  "tensorflow>=2.16; sys_platform == 'darwin' and platform_machine != 'arm64'",

  # Apple Silicon backend: encoder, scoring, GRIT, UMAP, and t-SNE.
  "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/Polligator/HECTOR"
Repository = "https://github.com/Polligator/HECTOR"

[project.optional-dependencies]
# Complete NVIDIA GPU stack for Linux and WSL2: TensorFlow with its CUDA 12
# runtime, cupy for VRAM measurement and memory-pool control, nvidia-ml-py to ask
# the driver which process holds which memory, and the RAPIDS libraries that
# accelerate reduce_dimensions() and evaluate_cells(). Installed together so a GPU
# user runs one command and is done.
#
# nvidia-ml-py is what keeps another process's memory out of the batch sizer's
# budget: cupy reports how much of the card is allocated but not by whom, and
# without the split a shared card reads as almost entirely free. Its absence is
# handled -- the sizer falls back to unallocated memory alone -- so this is a
# smaller-batches-than-necessary dependency, not a crash-without-it one.
cuda12 = [
  "tensorflow[and-cuda]>=2.16; sys_platform == 'linux'",
  "cupy-cuda12x>=13.0; sys_platform == 'linux'",
  "nvidia-ml-py>=12.0; sys_platform == 'linux'",
  "cuml-cu12>=24.10; sys_platform == 'linux'",
  "cugraph-cu12>=24.10; sys_platform == 'linux'",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "pytest>=8.0",
  "twine>=5.1",
  # Tutorials are authored as percent-format .py and paired to committed
  # .ipynb files with saved outputs; jupytext + nbconvert rebuild them.
  "jupytext>=1.16",
  "nbconvert>=7.0",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
include = ["hector", "hector.*"]

[tool.setuptools.package-data]
hector = [
  "resources/gene_mappings/*.parquet",
  "resources/gene_mappings/*.json",
  "resources/developmental_order/*.tsv",
  "resources/developmental_order/*.json",
]
